<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chai Corner Dhaba | Contact</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Chai Corner <span>Dhaba</span></a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="gallery.html">Gallery</a>
      <a class="active" href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="page-heading">
      <p class="eyebrow">We'd love to hear from you</p>
      <h1>Contact Us</h1>
      <p>Visit us or send a message.</p>
    </section>

    <section class="section contact-layout">
      <article class="card">
        <h2>Visit the Dhaba</h2>
        <p><strong>Address:</strong> [Add your address]</p>
        <p><strong>Phone:</strong> [Add your phone number]</p>
        <p><strong>Hours:</strong> [Add your opening hours]</p>
      </article>

      <article class="card">
        <h2>Send a Message</h2>
        <label for="visitor-name">Your name</label>
        <input id="visitor-name" type="text" placeholder="Enter your name">
        <label for="visitor-message">Your message</label>
        <textarea id="visitor-message" placeholder="Write your message"></textarea>
        <button class="button" type="button"
          onclick="window.alert('Thank you for connecting with Chai Corner Dhaba! We will get back to you shortly.')">
          Send Message
        </button>
      </article>
    </section>
  </main>

  <footer class="site-footer">Chai Corner Dhaba · Fresh chai and friendly faces</footer>
</body>
</html>
